<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self' https://wa.me; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.gstatic.com https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https://www.googleapis.com https://www.google-analytics.com https://www.googletagmanager.com https://va.vercel-scripts.com; upgrade-insecure-requests">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), interest-cohort=()">
<meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.svg">
<title>Page Not Found | EdgeWeb</title>
<meta name="description" content="The page you're looking for doesn't exist. Return to the EdgeWeb homepage to find what you need.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://edgeweb.co/404">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0A0C; --ink:#F5F1EC; --ink-dim:#A79E9A; --ink-faint:#6E6663;
    --accent-bright:#B23A57; --line:rgba(245,241,236,0.11); --line-strong:rgba(245,241,236,0.22);
    --f-display:'Fraunces',serif; --f-body:'Manrope',sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100svh; background:var(--bg); color:var(--ink); font-family:var(--f-body);
    display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;
  }
  a{ color:inherit; }
  .code{ font-family:var(--f-display); font-style:italic; font-weight:400; font-size:clamp(64px,14vw,140px); line-height:1; color:var(--ink-dim); }
  h1{ font-family:var(--f-display); font-weight:400; font-size:clamp(26px,3.4vw,38px); margin:18px 0 14px; }
  p{ color:var(--ink-dim); max-width:46ch; margin:0 auto 34px; line-height:1.6; }
  .btn{
    display:inline-flex; align-items:center; gap:10px; background:var(--ink); color:var(--bg);
    font-weight:600; font-size:14.5px; padding:15px 28px; border-radius:100px; text-decoration:none;
    transition:background .3s ease;
  }
  .btn:hover{ background:var(--accent-bright); color:var(--ink); }
  .links{ margin-top:30px; display:flex; gap:22px; justify-content:center; flex-wrap:wrap; }
  .links a{ font-size:13.5px; color:var(--ink-faint); text-decoration:none; border-bottom:1px solid transparent; }
  .links a:hover{ color:var(--ink); border-color:var(--line-strong); }
</style>
<!-- Vercel Speed Insights -->
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>

</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>This page doesn't exist.</h1>
    <p>The page you're looking for may have moved or the link may be out of date. Here's how to find what you need instead.</p>
    <a href="/" class="btn">Back to homepage</a>
    <div class="links">
      <a href="/services">Services</a>
      <a href="/work">Our Work</a>
      <a href="/contact">Contact Us</a>
    </div>
  </div>
</body>
</html>
